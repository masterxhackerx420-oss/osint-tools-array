<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT Tools Array — Beginners to Experts</title>
<style>
  :root { --bg: #0a0a0f; --card: #14141c; --accent: #ff6b35; --accent2: #ff9f1c; --text: #e8e8f0; --muted: #8888a0; --border: #2a2a3a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  header { background: linear-gradient(180deg, #1a0a00 0%, var(--bg) 100%); padding: 2rem 1.5rem 1.5rem; text-align: center; border-bottom: 1px solid var(--border); }
  .hero-image { margin: 1.5rem auto; max-width: 900px; }
  .hero-image img { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 8px 32px rgba(255, 107, 53, 0.3); }
  header h1 { font-size: 2.6rem; margin: 1rem 0 0.5rem; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  header p { color: var(--muted); max-width: 700px; margin: 0.4rem auto; }
  .hero { margin: 1rem 0; font-size: 1.1rem; color: var(--accent2); }
  .controls { max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; display: flex; gap: 1rem; flex-wrap: wrap; }
  input, select { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 0.75rem 1rem; border-radius: 8px; font-size: 1rem; }
  input { flex: 1; min-width: 200px; }
  .tools { max-width: 1100px; margin: 0 auto 3rem; padding: 0 1rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem; }
  .tool { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.2rem; transition: transform 0.2s, border-color 0.2s; }
  .tool:hover { transform: translateY(-4px); border-color: var(--accent); }
  .tool h3 { margin: 0 0 0.4rem; color: var(--accent2); }
  .badge { display: inline-block; font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 4px; margin-right: 0.3rem; background: #222; }
  .beginner { background: #1a3a1a; color: #6f6; }
  .intermediate { background: #3a2a1a; color: #fa6; }
  .expert { background: #3a1a1a; color: #f66; }
  .tool a { color: var(--accent); text-decoration: none; }
  .tool a:hover { text-decoration: underline; }
  footer { text-align: center; padding: 2rem; color: var(--muted); border-top: 1px solid var(--border); font-size: 0.9rem; }
</style>
</head>
<body>
<header>
  <div class="hero-image">
    <img src="data:image/jpeg;base64,PLACEHOLDER" alt="WolfSec Team — OSINT Tools Array">
  </div>

  <p>A large curated collection of Open Source Intelligence tools — from browser-only beginners to expert automation and link analysis.</p>
  <p>Free-first • OPSEC aware • Updated October 2026</p>
  <div class="hero">LULZ / WolfSec branded OSINT resource</div>
</header>
